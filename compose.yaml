name: ${COMPOSE_PROJECT_NAME:-greek-reader}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  ASPNETCORE_URLS: http://+:8080
  ConnectionStrings__Postgres: "Host=${DB_HOST:-db};Port=${DB_PORT:-5432};Database=${DB_NAME:-greekreader};Username=${DB_USER:-greekreader};Password=${POSTGRES_PASSWORD};Maximum Pool Size=20"
  DataProtection__KeysPath: ${DATA_PROTECTION_KEYS_PATH:-/var/lib/greekreader/dataprotection-keys}

x-api-common: &api-common
  image: greek-reader-api:local
  environment: *api-environment
  networks:
    - app
  depends_on:
    db:
      condition: service_healthy
  logging: *default-logging

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-greekreader}
      POSTGRES_USER: ${DB_USER:-greekreader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    # PostgreSQL 18 moved PGDATA to /var/lib/postgresql/18/docker and the
    # image's volume to /var/lib/postgresql. Mount the named volume there.
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-greekreader} -d ${DB_NAME:-greekreader}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  migrate:
    <<: *api-common
    command: ["--migrate"]
    restart: "no"

  api:
    <<: *api-common
    build:
      context: .
      dockerfile: GreekReaderAPI/Dockerfile
      additional_contexts:
        engine: ${ENGINE_CONTEXT:-../engine}
    restart: unless-stopped
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-5080}:8080"
    environment:
      <<: *api-environment
      App__BackendBaseUrl: ${API_BASE_URL}
      App__FrontendBaseUrl: ${FRONTEND_BASE_URL}
      Email__SmtpHost: ${SMTP_HOST}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__UseSsl: ${SMTP_USE_SSL:-true}
      Email__FromEmail: ${SMTP_FROM}
      Email__FromName: ${SMTP_FROM_NAME:-Greek Reader}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
    volumes:
      - dataprotection-keys:${DATA_PROTECTION_KEYS_PATH:-/var/lib/greekreader/dataprotection-keys}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  import:
    <<: *api-common
    command: ["--import"]
    restart: "no"
    volumes:
      - dataprotection-keys:${DATA_PROTECTION_KEYS_PATH:-/var/lib/greekreader/dataprotection-keys}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    profiles: ["import"]

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../../frontend/web}
    image: greek-reader-frontend:local
    restart: unless-stopped
    environment:
      PORT: 4000
      API_BASE_URL: ${API_BASE_URL}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-4000}:4000"
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/runtime-config.js').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

volumes:
  postgres-data:
  dataprotection-keys:

networks:
  app:
